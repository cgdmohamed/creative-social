map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# This listener is reachable only through the trusted Coolify HTTPS proxy.
map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }
server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 100m;
  add_header X-Content-Type-Options nosniff always;
  location = /healthz { access_log off; return 200 'gateway alive'; }
  location = /api { return 308 /api/; }
  location /uploads/ { alias /app/uploads/; autoindex off; }
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
  location / {
    proxy_pass http://frontend:4200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}
