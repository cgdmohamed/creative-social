name: Production image build check (no deployment)
on:
  workflow_dispatch:
    inputs:
      public_url:
        description: HTTPS origin for build-time public variables; no trailing slash
        required: true
        default: https://social.example.com
permissions:
  contents: read
jobs:
  build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Create isolated synthetic build-check environment
        env:
          PUBLIC_URL: ${{ inputs.public_url }}
        run: |
          node <<'JS'
          const fs = require('fs');
          const crypto = require('crypto');
          const names = ['JWT_SECRET','POSTGRES_ADMIN_PASSWORD','APP_DB_PASSWORD','REDIS_PASSWORD','TEMPORAL_POSTGRES_ADMIN_PASSWORD','TEMPORAL_DB_PASSWORD'];
          const values = names.map(name => `${name}=${crypto.randomBytes(32).toString('hex')}`);
          values.push(`PUBLIC_URL=${process.env.PUBLIC_URL}`, `CREATIVE_REVISION=${process.env.GITHUB_SHA}`);
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/creative-build.env`, values.join('\n'), {mode: 0o600});
          JS
      - name: Validate production configuration
        run: docker compose --env-file "$RUNNER_TEMP/creative-build.env" -f docker-compose.production.yaml config --quiet
      - name: Build application and support images, including native-module probes
        run: docker compose --env-file "$RUNNER_TEMP/creative-build.env" -f docker-compose.production.yaml build backend gateway postgres redis temporal-postgres temporal-schema
      # Deliberately no up/run, registry push, production secrets or deploy step.
