name: Publish Creative Social production image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.production'
      - 'deploy/coolify/production/**'
      - 'apps/**'
      - 'libraries/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/publish-production-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'cgdmohamed/creative-social' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable commit-tagged app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          push: true
          tags: ghcr.io/cgdmohamed/creative-social:${{ github.sha }}
          build-args: |
            PUBLIC_URL=https://smm.creativecode.com.eg
            SOURCE_REVISION=${{ github.sha }}
          provenance: mode=min
          cache-from: type=gha,scope=creative-social-production
          cache-to: type=gha,mode=max,scope=creative-social-production
