---
name: Build

on:
  push:
  merge_group:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://unused:unused@localhost/unused
      INBOX_COLLECTION_ENABLED: 'false'
      REPORTING_COLLECTION_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    

    strategy:
      matrix:
        node-version: ['22.23.4']
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.6.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

#      - name: Setup pnpm cache
#        uses: actions/cache@v4
#        with:
#          path: |
#            ${{ env.STORE_PATH }}
#            ${{ github.workspace }}/.next/cache
#          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
#          restore-keys: |
#            ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integration lint
        run: pnpm run lint:integration

      - name: Combined Inbox and Reporting tests
        run: pnpm run test:combined

      - name: API and worker types
        run: |
          pnpm exec tsc --noEmit -p apps/backend/tsconfig.json
          pnpm exec tsc --noEmit -p apps/orchestrator/tsconfig.json

      - name: Build
        run: pnpm run build

      - name: Frontend types
        run: pnpm exec tsc --noEmit -p apps/frontend/tsconfig.json

      - name: Validate staging Compose (no deployment)
        run: docker compose --env-file deploy/coolify/staging.env.example -f deploy/coolify/compose.staging.yaml config --quiet
